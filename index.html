<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Board Game</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

    <h1>AI Board Game</h1>

    <button id="hostBtn">방 만들기</button>
    <button id="joinBtn">방 참가</button>

    <div id="characterSelect" class="hidden">

        <h2>캐릭터 선택</h2>

        <div id="characterGrid"></div>

    </div>

</div>

<div id="game">

    <div id="board"></div>

    <div id="sidebar">

        <h3>행동 큐</h3>

        <ol id="queue"></ol>

        <button id="resetActions">행동 초기화</button>

        <button id="endTurn">턴 종료</button>

    </div>

</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
